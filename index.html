    <style>
      @font-face{font-family:"Opening Serif";src:url('./fonts/SourceHanSerifCN-Regular-subset.woff2') format('woff2');font-style:normal;font-weight:400;font-display:swap}
      html,body,#root{min-height:100%;margin:0;background:#eee8dc;color:#3f3731}
      .initial-opening{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#eee8dc url('./assets/game/paper-background.webp') center center/100% auto repeat-y;font-family:"Opening Serif","Songti SC","STSong",serif}

      .initial-opening-layer{position:absolute;pointer-events:none}.initial-opening-layer>img{display:block;width:100%;height:100%;object-fit:contain}

      .initial-cloud-track{position:absolute;inset:0 auto 0 0;width:200%;height:100%;display:flex;animation:initial-cloud-scroll 60s linear infinite;will-change:transform}
      .initial-cloud-front .initial-cloud-track{animation-duration:42s}.initial-cloud-track img{display:block;flex:0 0 50%;width:50%;height:100%;object-fit:contain}
      .initial-title{left:32.755%;top:14.593%;width:32.292%;height:22.739%}.initial-palace{left:35.648%;top:41.45%;width:28.704%;height:26.231%}

      @keyframes initial-cloud-scroll{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
